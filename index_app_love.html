<style>
  html, body { margin: 0; height: 100%; background: #b9a6e6; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: center; }
  /* Escenario vertical tipo móvil; en pantallas anchas queda centrado */

  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">

      <stop offset=".6" stop-color="#fff0c8"/>
      <stop offset="1" stop-color="#fff7d6"/>

    <radialGradient id="sol" cx=".5" cy=".5" r=".5">
